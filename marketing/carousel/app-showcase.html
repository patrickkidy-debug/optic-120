<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OculoSaaS — Démo défilante (toutes les fonctionnalités)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --brand:linear-gradient(120deg,#7c3aed 0%,#ec4899 52%,#f97316 100%);
  --brand-soft:linear-gradient(120deg,rgba(124,58,237,.14),rgba(236,72,153,.12),rgba(249,115,22,.14));
  --violet:#7c3aed;--pink:#ec4899;--orange:#f97316;--cyan:#0a97b5;
  --ink:#0f1730;--muted:#5b6b85;--faint:#94a1b6;
  --canvas:#f4f6fb;--card:#ffffff;--panel:#f7f9fc;
  --line:rgba(15,23,42,.09);--line2:rgba(15,23,42,.05);
  --sv:rgba(124,58,237,.10);--so:rgba(249,115,22,.12);--sp:rgba(236,72,153,.10);--sc:rgba(10,151,181,.12);
  --success:#0ea371;--ss:rgba(14,163,113,.12);--warning:#e0850b;--sw:rgba(224,133,11,.14);--danger:#e5484d;--sd:rgba(229,72,77,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#0b1220;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none}

/* Carrousel */
.viewer{position:fixed;inset:0;overflow:hidden}
.track{display:flex;height:100%;width:100%;transition:transform .5s cubic-bezier(.7,0,.2,1);will-change:transform}
.slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:26px 26px 64px}
.progress{position:fixed;top:0;left:0;height:4px;background:var(--brand);z-index:50;transition:width .4s ease}
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.92);box-shadow:0 10px 30px rgba(0,0,0,.35);display:grid;place-items:center;color:#0f1730;transition:transform .15s,opacity .2s}
.arrow:hover{transform:translateY(-50%) scale(1.07)}
.arrow.l{left:20px}.arrow.r{right:20px}
.arrow svg{width:24px;height:24px}
.arrow[disabled]{opacity:.3;pointer-events:none}
.hud{position:fixed;left:0;right:0;bottom:16px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hud .label{pointer-events:none;background:rgba(15,20,35,.72);color:#fff;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;backdrop-filter:blur(6px)}
.hud .label b{color:#c9b4ff;font-weight:700}
.dots{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:80vw}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.32);cursor:pointer;transition:.2s}
.dots i.on{background:#fff;width:24px;border-radius:5px}
.counter{position:fixed;top:16px;right:20px;z-index:40;color:#fff;font-weight:700;font-size:14px;background:rgba(15,20,35,.6);padding:6px 13px;border-radius:999px;backdrop-filter:blur(6px)}
.hint{position:fixed;top:16px;left:20px;z-index:40;color:rgba(255,255,255,.7);font-size:12.5px;font-weight:500;background:rgba(15,20,35,.5);padding:6px 13px;border-radius:999px}

/* App window */
.win{width:min(1440px,100%);height:100%;max-height:860px;background:var(--card);border-radius:20px;overflow:hidden;
  box-shadow:0 40px 100px -40px rgba(0,0,0,.6);display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.5)}
.wbar{height:44px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px}
.wbar .d{width:11px;height:11px;border-radius:50%}
.wbar .u{margin-left:14px;background:#fff;border:1px solid var(--line);border-radius:7px;height:26px;flex:1;max-width:460px;display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--faint);font-size:13px}
.wbar .u svg{width:13px;height:13px}
.app{flex:1;min-height:0;display:flex}

/* Sidebar */
.side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--brand);display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(124,58,237,.5)}
.brand .lg svg{width:21px;height:21px}
.brand .nm{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .nm b{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.grp{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;padding:14px 10px 5px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:13.5px;font-weight:600;position:relative;margin-bottom:1px}
.item svg{width:17px;height:17px;flex:none;stroke:currentColor}
.item .bdg{margin-left:auto;background:var(--sd);color:var(--danger);font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px}
.item.on{background:var(--sv);color:var(--violet)}
.item.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--brand)}

/* Topbar + main */
.col{flex:1;min-height:0;display:flex;flex-direction:column}
.top{height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.branch{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px}
.branch svg{width:16px;height:16px;stroke:var(--violet)}
.branch .cv{color:var(--faint);width:14px;height:14px}
.tr{display:flex;align-items:center;gap:14px}
.tr .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.tr .ic svg{width:16px;height:16px}
.tr .lang{font-weight:700;font-size:13px;color:var(--muted)}
.tr .user{display:flex;align-items:center;gap:9px}
.tr .user .av{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.tr .user .nm{font-weight:700;font-size:13.5px;line-height:1.15}
.tr .user .nm small{display:block;color:var(--faint);font-weight:500;font-size:11.5px}
.main{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 30px;background:var(--canvas)}
.main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* Content blocks */
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.phead h1{font-family:'Sora';font-weight:800;font-size:24px;letter-spacing:-.02em}
.phead p{color:var(--faint);font-size:14px;margin-top:3px}
.btnp{background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;padding:10px 17px;border-radius:10px;display:inline-flex;gap:7px;align-items:center;box-shadow:0 10px 22px -12px rgba(124,58,237,.6);white-space:nowrap}
.btnp svg{width:16px;height:16px;stroke:#fff}
.btno{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;padding:9px 14px;border-radius:10px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:12px;color:var(--violet);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px}
.eyebrow .bar{width:26px;height:3px;border-radius:2px;background:var(--brand)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.kpi .ki{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;float:right}
.kpi .ki svg{width:18px;height:18px}
.klbl{font-size:12.5px;color:var(--faint);font-weight:600}
.kval{font-family:'Sora';font-weight:800;font-size:22px;margin-top:4px;letter-spacing:-.02em;white-space:nowrap}
.kchg{font-size:12px;font-weight:700;margin-top:5px}
.up{color:var(--success)}.dn{color:var(--danger)}
.iv{background:var(--sv);color:var(--violet)}.io{background:var(--so);color:var(--orange)}.ip{background:var(--sp);color:var(--pink)}.ic2{background:var(--sc);color:var(--cyan)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tbl{overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line2);font-size:14px}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ss);color:var(--success)}.t-w{background:var(--sw);color:var(--warning)}.t-d{background:var(--sd);color:var(--danger)}
.t-i{background:var(--sv);color:var(--violet)}.t-c{background:var(--sc);color:var(--cyan)}
.tag svg{width:13px;height:13px;flex:none;vertical-align:-2px}
.av2{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--violet);display:inline-grid;place-items:center;font-weight:800;font-size:13px;border:1px solid rgba(124,58,237,.14);vertical-align:middle;margin-right:10px}
.whowrap{display:inline-block;vertical-align:middle}
.nm2{font-weight:700}.sub2{display:block;color:var(--faint);font-weight:500;font-size:12px}
.money{font-family:'Sora';font-weight:700}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.actbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.actbtn svg{width:14px;height:14px}
.wa{color:#128C7E;background:rgba(37,211,102,.10);border-color:rgba(37,211,102,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pad{padding:18px}
.h3{font-family:'Sora';font-weight:700;font-size:16px;margin-bottom:12px}

/* IA panel */
.ia{background:linear-gradient(160deg,#fbf9ff,#fff 42%);border:1px solid rgba(124,58,237,.16);border-radius:16px;padding:18px}
.ia-h{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.ia-h .sp{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(124,58,237,.6)}
.ia-h .sp svg{width:18px;height:18px}
.ia-h .t{font-family:'Sora';font-weight:800;font-size:17px}.ia-h .t small{display:block;font-family:'Inter';font-weight:500;font-size:12.5px;color:var(--faint)}
.ia-h .live{margin-left:auto;font-size:12px;font-weight:700;color:var(--violet);background:var(--sv);padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.ia-h .live b{width:7px;height:7px;border-radius:50%;background:var(--violet)}
.ia-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.ia-cards{display:flex;flex-direction:column;gap:10px}
.ia-c{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff}
.ia-c .k{font-size:12.5px;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:6px}
.ia-c .k svg{width:15px;height:15px;flex:none}
.ia-c .v{font-family:'Sora';font-weight:800;font-size:22px;margin-top:3px;letter-spacing:-.02em}
.ia-c .v small{font-size:13px;color:var(--muted);font-weight:600}
.ia-risk{background:var(--sw);border-color:rgba(224,133,11,.25)}.ia-risk .v{font-size:15px;color:var(--warning)}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px 8px;display:flex;flex-direction:column}
.lg{display:flex;gap:16px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;padding-left:4px}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:14px;height:4px;border-radius:2px}
.chartbox svg{width:100%;height:180px}

/* Caisse */
.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;align-content:start}
.prod{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.prod .ph{height:52px;border-radius:9px;background:var(--brand-soft);margin-bottom:9px;display:grid;place-items:center}
.prod .ph svg{width:26px;height:26px;stroke:var(--violet);opacity:.85}
.prod b{font-size:13.5px;display:block}.prod .pr{font-family:'Sora';font-weight:700;color:var(--violet);margin-top:3px;font-size:13.5px}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.ci{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.ci small{color:var(--faint)}
.ctot{margin-top:auto;padding-top:12px;border-top:2px solid var(--line)}
.ctot .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.ctot .grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.ctot .grand b{font-family:'Sora';font-size:25px;font-weight:800}
.mm{display:flex;gap:7px;margin-top:12px}
.mm .m{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.wave{color:#12a7e0;border-color:rgba(18,167,224,.4)!important}.om{color:#ff7900;border-color:rgba(255,121,0,.4)!important}.free{color:#e2001a;border-color:rgba(226,0,26,.35)!important}

/* barcode */
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lbl{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;text-align:center}
.lbl .nm{font-weight:700;font-size:14px;margin-bottom:10px}
.barcode{height:56px;margin:0 auto 10px;background:repeating-linear-gradient(90deg,#0f1730 0 2px,#fff 2px 3px,#0f1730 3px 6px,#fff 6px 8px,#0f1730 8px 9px,#fff 9px 13px)}
.lbl .sku{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--faint);letter-spacing:1px}
.lbl .pr{font-family:'Sora';font-weight:800;font-size:17px;margin-top:6px}

/* bars / progress */
.pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:var(--brand);border-radius:999px}
.usage{display:grid;grid-template-columns:1fr 1fr;gap:14px 30px}
.usage .u{}.usage .u .row{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.usage .u .row .g{color:var(--faint);font-weight:500}

/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;position:relative}
.plan.pop{border-color:var(--violet);box-shadow:0 0 0 3px var(--sv)}
.plan .pop-b{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px}
.plan h4{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.plan .price{font-family:'Sora';font-weight:800;font-size:26px;margin:8px 0 4px}.plan .price small{font-size:13px;color:var(--muted);font-weight:600}
.plan ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.plan li{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.plan li svg{width:15px;height:15px;stroke:var(--success);flex:none;margin-top:1px}

/* agenda */
.appt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:10px}
.appt .time{font-family:'Sora';font-weight:800;font-size:15px;color:var(--violet);width:60px;flex:none}
.appt .b{width:3px;align-self:stretch;border-radius:2px;background:var(--brand)}
.appt .who b{font-size:14px}.appt .who small{display:block;color:var(--faint);font-size:12px}
.appt .tg{margin-left:auto}

/* chat */
.chat{max-width:440px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.chat .ch{background:var(--brand);color:#fff;padding:14px 16px;font-weight:700}
.chat .ch small{display:block;font-weight:500;opacity:.9;font-size:12.5px}
.chat .cb{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:180px;background:var(--panel)}
.bub{max-width:80%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.4}
.bub.in{background:#fff;border:1px solid var(--line);align-self:flex-start}
.bub.me{background:var(--sv);color:var(--ink);align-self:flex-end}
.chat .cf{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat .cf input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;background:var(--panel)}
.chat .cf button{width:40px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}
.chat .cf button svg{width:16px;height:16px;stroke:#fff}

/* Cover / CTA */
.cover,.cta{width:min(1200px,100%);height:100%;max-height:860px;background:var(--card);border-radius:20px;position:relative;overflow:hidden;padding:64px;display:flex;flex-direction:column;box-shadow:0 40px 100px -40px rgba(0,0,0,.6)}
.cover::before,.cta::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(70px);background:radial-gradient(circle,rgba(124,58,237,.20),transparent 70%);top:-160px;right:-120px}
.cover::after,.cta::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(70px);background:radial-gradient(circle,rgba(249,115,22,.16),transparent 70%);bottom:-180px;left:-140px}
.cover>*,.cta>*{position:relative;z-index:1}
.cover .top,.cta .top{border:0;height:auto;padding:0;justify-content:space-between;margin-bottom:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--sv);color:var(--violet);font-weight:700;font-size:14px;border:1px solid rgba(124,58,237,.16)}
.chip svg{width:16px;height:16px}
.cover .mid{margin:auto 0}
.cover h1{font-family:'Sora';font-weight:800;font-size:58px;line-height:1.04;letter-spacing:-.025em}
.g{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover p{font-size:22px;color:var(--muted);margin-top:18px;max-width:760px;line-height:1.45}
.cover .pills{display:flex;flex-wrap:wrap;gap:11px;margin-top:30px}
.cover .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-weight:600;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:9px}
.cover .pill svg{width:17px;height:17px;stroke:var(--violet)}
.cover .foot,.cta .foot{margin-top:auto;padding-top:24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--faint);font-weight:600;font-size:16px}
.site{display:flex;align-items:center;gap:9px;color:var(--muted)}.site svg{width:18px;height:18px;stroke:var(--muted)}
.cta{text-align:center;align-items:center;justify-content:center}
.cta .top{width:100%}
.cta .cbody{margin:auto;display:flex;flex-direction:column;align-items:center}
.cta h1{font-family:'Sora';font-weight:800;font-size:52px;line-height:1.06;letter-spacing:-.02em}
.cta p{font-size:21px;color:var(--muted);margin-top:16px;max-width:760px}
.cta .go{margin-top:34px;display:inline-flex;align-items:center;gap:12px;background:var(--brand);color:#fff;font-family:'Sora';font-weight:800;font-size:24px;padding:20px 38px;border-radius:16px;box-shadow:0 22px 50px -22px rgba(124,58,237,.7)}

/* ---------- Rendu carrousel ---------- */
const track=document.getElementById('track');
SLIDES.forEach(s=>{const d=document.createElement('div');d.className='slide';d.innerHTML=s.html;track.appendChild(d);});
const dots=document.getElementById('dots');
SLIDES.forEach((s,i)=>{const b=document.createElement('i');if(i===0)b.className='on';b.onclick=()=>go(i);dots.appendChild(b);});
const N=SLIDES.length;let cur=0;
const prevB=document.getElementById('prev'),nextB=document.getElementById('next');
const counter=document.getElementById('counter'),label=document.getElementById('label'),prog=document.getElementById('prog');
function go(i){
  cur=Math.max(0,Math.min(N-1,i));
  track.style.transform=`translateX(-${cur*100}%)`;
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===cur));
  counter.textContent=`${cur+1} / ${N}`;
  label.innerHTML=`<b>${SLIDES[cur].group}</b> · ${SLIDES[cur].title}`;
  prog.style.width=`${((cur+1)/N)*100}%`;
  prevB.disabled=cur===0;nextB.disabled=cur===N-1;
  // scroll active nav into view
  const nav=track.children[cur].querySelector('.nav .item.on');
  if(nav)nav.scrollIntoView({block:'center'});
}
prevB.onclick=()=>go(cur-1);nextB.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Home')go(0);if(e.key==='End')go(N-1);});
// swipe / drag
let sx=0,sy=0,drag=false;
const vp=document.querySelector('.viewer');
vp.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=true;},{passive:true});
vp.addEventListener('touchend',e=>{if(!drag)return;drag=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1));});
let wlock=0;
vp.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>30){const t=Date.now();if(t-wlock>500){wlock=t;go(cur+(e.deltaX>0?1:-1));}}},{passive:true});

/* ---------- Graphe IA ---------- */
(function(){
 const hist=[95,110,120,105,140,180,90,100,118,128,112,150,190,98,108,126,138,120,162,205,110,120,140,150,132,178,222,120,132,152];
 const fc=[160,170,180,152,198,246,134,152,178,188,160,208,258,142];
 const all=hist.concat(fc),W=900,H=260,pl=8,pr=8,pt=14,pb=18;
 const mn=Math.min(...all)*0.75,mx=Math.max(...all)*1.06;
 const X=i=>pl+i*(W-pl-pr)/(all.length-1),Y=v=>H-pb-(v-mn)/(mx-mn)*(H-pt-pb);
 const P=(a,o)=>a.map((v,i)=>(i?'L':'M')+X(o+i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const svgEl=document.getElementById('fchart');if(!svgEl)return;
 const jx=X(hist.length-1).toFixed(1),jy=Y(hist[hist.length-1]).toFixed(1);
 const hp=P(hist,0), fp='M'+jx+' '+jy+' '+fc.map((v,i)=>'L'+X(hist.length+i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const area=hp+'L'+jx+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';
 let grid='';for(let g=0;g<=3;g++){const gy=(pt+g*(H-pt-pb)/3).toFixed(1);grid+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="rgba(15,23,42,.06)"/>`;}
 svgEl.innerHTML=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(124,58,237,.22)"/><stop offset="1" stop-color="rgba(124,58,237,0)"/></linearGradient></defs>${grid}<line x1="${jx}" y1="${pt}" x2="${jx}" y2="${H-pb}" stroke="rgba(124,58,237,.30)" stroke-dasharray="4 5"/><path d="${area}" fill="url(#ag)"/><path d="${hp}" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${fp}" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="${jx}" cy="${jy}" r="4.5" fill="#7c3aed"/>`;
})();
go(0);
</script>
