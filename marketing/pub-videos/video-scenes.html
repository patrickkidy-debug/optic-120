<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --brand:linear-gradient(120deg,#7c3aed 0%,#ec4899 52%,#f97316 100%);
  --brand-soft:linear-gradient(120deg,rgba(124,58,237,.22),rgba(236,72,153,.18),rgba(249,115,22,.22));
  --violet:#8b5cf6;--pink:#ec4899;--orange:#f97316;--cyan:#22d3ee;
  --bg:#080c16;--surface:#111a2e;--surface2:#16203a;--surface3:#1d2949;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.09);
  --text:#e8edf7;--muted:#94a3b8;--faint:#5b6b85;
  --sv:rgba(139,92,246,.16);--so:rgba(249,115,22,.16);--sp:rgba(236,72,153,.16);--sc:rgba(34,211,238,.16);
  --success:#20c997;--danger:#ef4444;--warning:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;font-family:'Inter',system-ui,sans-serif;color:var(--text)}
.scene{position:relative;width:1080px;height:1920px;overflow:hidden;background:
  radial-gradient(900px 700px at 88% -6%,rgba(124,58,237,.22),transparent 60%),
  radial-gradient(900px 800px at -10% 108%,rgba(249,115,22,.16),transparent 60%),
  var(--bg);
  padding:70px 64px;display:flex;flex-direction:column}
.grid{position:absolute;inset:0;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 78%)}
.scene>*{position:relative;z-index:1}

.brandrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.logo{display:flex;align-items:center;gap:16px}
.logo .ic{width:64px;height:64px;border-radius:18px;background:var(--brand);display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(124,58,237,.6)}
.logo .ic svg{width:36px;height:36px}
.logo .nm{font-family:'Sora';font-weight:800;font-size:34px;letter-spacing:-.02em}
.logo .nm b{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:var(--sv);color:#c9b4ff;font-weight:700;font-size:21px;border:1px solid rgba(139,92,246,.3)}
.chip b{width:9px;height:9px;border-radius:50%;background:var(--violet);display:block}

h1{font-family:'Sora';font-weight:800;font-size:58px;line-height:1.06;letter-spacing:-.02em;margin-bottom:34px}
.g{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}

/* app window */
.win{flex:1;min-height:0;border-radius:30px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 60px 120px -50px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden;display:flex;flex-direction:column}
.wbar{height:60px;flex:none;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:11px}
.wbar .d{width:14px;height:14px;border-radius:50%}
.wbar .u{margin-left:16px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;height:36px;flex:1;max-width:520px;display:flex;align-items:center;padding:0 16px;color:var(--faint);font-size:19px;gap:9px}
.wbar .u svg{width:19px;height:19px;flex:none}
.risk svg{width:24px;height:24px;flex:none}
.wbody{flex:1;min-height:0;padding:30px;display:flex;flex-direction:column;gap:22px;overflow:hidden}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.kpi .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;float:right}
.kpi .ico svg{width:27px;height:27px}
.kpi .lbl{font-size:21px;color:var(--muted);font-weight:600}
.kpi .val{font-family:'Sora';font-weight:800;font-size:40px;margin-top:6px;letter-spacing:-.02em;white-space:nowrap}
.kpi .chg{font-size:19px;font-weight:700;margin-top:8px}
.up{color:var(--success)}.dn{color:var(--danger)}
.iv{background:var(--sv);color:var(--violet)}.io{background:var(--so);color:var(--orange)}.ip{background:var(--sp);color:var(--pink)}.icy{background:var(--sc);color:var(--cyan)}

.ia{background:linear-gradient(160deg,rgba(139,92,246,.10),rgba(17,26,46,.4));border:1px solid rgba(139,92,246,.28);border-radius:24px;padding:26px;flex:1;min-height:0;display:flex;flex-direction:column}
.ia-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ia-h .sp{width:56px;height:56px;border-radius:15px;background:var(--brand);display:grid;place-items:center;box-shadow:0 12px 26px -8px rgba(124,58,237,.7)}
.ia-h .sp svg{width:30px;height:30px}
.ia-h .t{font-family:'Sora';font-weight:800;font-size:29px}
.ia-h .t small{display:block;font-family:'Inter';font-weight:500;font-size:19px;color:var(--muted);margin-top:2px}
.ia-h .live{margin-left:auto;font-size:19px;font-weight:700;color:#c9b4ff;background:var(--sv);padding:9px 17px;border-radius:999px;display:flex;align-items:center;gap:9px}
.ia-h .live b{width:10px;height:10px;border-radius:50%;background:var(--violet);display:block}
.ia-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.st{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.st .k{font-size:18px;color:var(--muted);font-weight:600}
.st .v{font-family:'Sora';font-weight:800;font-size:30px;margin-top:5px;letter-spacing:-.02em;white-space:nowrap}
.st .v small{font-size:19px;color:var(--muted);font-weight:600}
.chartbox{flex:1;min-height:0;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:18px;padding:20px 18px 12px;display:flex;flex-direction:column}
.lg{display:flex;gap:26px;font-size:20px;color:var(--muted);font-weight:600;margin-bottom:6px;padding-left:6px}
.lg span{display:inline-flex;align-items:center;gap:9px}.lg i{width:22px;height:5px;border-radius:3px}
.chartbox svg{flex:1;width:100%;min-height:0}
.risk{margin-top:16px;background:var(--so);border:1px solid rgba(249,115,22,.35);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;color:#ffb27a}
.risk svg{width:24px;height:24px}

/* end card */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.endlogo{width:150px;height:150px;border-radius:40px;background:var(--brand);display:grid;place-items:center;box-shadow:0 30px 70px -20px rgba(124,58,237,.8);margin-bottom:40px}
.endlogo svg{width:88px;height:88px}
.endname{font-family:'Sora';font-weight:800;font-size:96px;letter-spacing:-.03em}
.endname b{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.endtag{font-size:32px;color:var(--muted);margin-top:24px;max-width:820px;line-height:1.4}
.endcta{margin-top:52px;display:inline-flex;align-items:center;gap:16px;white-space:nowrap;background:var(--brand);color:#fff;font-family:'Sora';font-weight:800;font-size:38px;padding:26px 52px;border-radius:20px;box-shadow:0 30px 70px -24px rgba(124,58,237,.8)}
.endcta svg{width:40px;height:40px;flex:none}
.endurl{margin-top:34px;font-size:30px;font-weight:700;color:var(--muted)}
</style>
</head>
<body>
<script>
  var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SPARK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/></svg>';
  var I={
    money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v6M18 9v6"/></svg>',
    trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
    cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 12.4a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.2L22 7H6"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17.4v.2"/></svg>',
    box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
    lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  };
  document.write(`
  <section class="scene" id="dashboard">
    <div class="grid"></div>
    <div class="brandrow">
      <div class="logo"><span class="ic">${EYE}</span><span class="nm">Oculo<b>SaaS</b></span></div>
      <span class="chip"><b></b>Temps réel</span>
    </div>
    <h1>Un tableau de bord qui <span class="g">anticipe</span>.</h1>
    <div class="win">
      <div class="wbar"><span class="d" style="background:#ff5f57"></span><span class="d" style="background:#febc2e"></span><span class="d" style="background:#28c840"></span><span class="u">${I.lock} app.oculosaas.com/dashboard</span></div>
      <div class="wbody">
        <div class="kpis">
          <div class="kpi"><span class="ico iv">${I.money}</span><div class="lbl">CA du jour</div><div class="val">485 000 F</div><div class="chg up">▲ +12,4%</div></div>
          <div class="kpi"><span class="ico io">${I.trend}</span><div class="lbl">CA mensuel</div><div class="val">3,72 M F</div><div class="chg up">▲ +18%</div></div>
          <div class="kpi"><span class="ico ip">${I.cart}</span><div class="lbl">Ventes du jour</div><div class="val">27</div><div class="chg up">▲ +5 vs hier</div></div>
          <div class="kpi"><span class="ico icy">${I.alert}</span><div class="lbl">Stocks faibles</div><div class="val">3</div><div class="chg dn">à réappro.</div></div>
        </div>
        <div class="ia">
          <div class="ia-h"><span class="sp">${SPARK}</span><div class="t">IA prédictive — Prévisions économiques<small>Tendance + saisonnalité · 90 jours analysés</small></div><span class="live"><b></b>En direct</span></div>
          <div class="ia-stats">
            <div class="st"><div class="k">CA projeté ce mois</div><div class="v">4 250 000 <small>F</small></div></div>
            <div class="st"><div class="k">Tendance (14 j)</div><div class="v" style="color:var(--success)">+18%</div></div>
            <div class="st"><div class="k">Meilleur jour</div><div class="v">Samedi</div></div>
          </div>
          <div class="chartbox"><div class="lg"><span><i style="background:#8b5cf6"></i>Réalisé (30 j)</span><span><i style="background:#f97316"></i>Prévision IA (14 j)</span></div><svg id="fchart" viewBox="0 0 980 280" preserveAspectRatio="none"></svg></div>
          <div class="risk">${I.alert.replace('currentColor','#ffb27a')} Rupture anticipée : Verres progressifs · dans 6 jours</div>
        </div>
      </div>
    </div>
  </section>

  <section class="scene" id="endcard">
    <div class="grid"></div>
    <div class="center">
      <span class="endlogo">${EYE}</span>
      <div class="endname">Oculo<b>SaaS</b></div>
      <div class="endtag">La plateforme tout-en-un des cabinets d'optique &amp; cliniques modernes.</div>
      <div class="endcta">${I.arrow} Utiliser le logiciel</div>
      <div class="endurl">oculosaas.com</div>
    </div>
  </section>
  `);

  // graphe IA (Réalisé violet + Prévision orange pointillé)
  (function(){
   var hist=[95,110,120,105,140,180,90,100,118,128,112,150,190,98,108,126,138,120,162,205,110,120,140,150,132,178,222,120,132,152];
   var fc=[160,170,180,152,198,246,134,152,178,188,160,208,258,142];
   var all=hist.concat(fc),W=980,H=280,pl=8,pr=8,pt=14,pb=16;
   var mn=Math.min.apply(null,all)*0.72,mx=Math.max.apply(null,all)*1.06;
   var X=function(i){return pl+i*(W-pl-pr)/(all.length-1);},Y=function(v){return H-pb-(v-mn)/(mx-mn)*(H-pt-pb);};
   var P=function(a,o){return a.map(function(v,i){return (i?'L':'M')+X(o+i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');};
   var svg=document.getElementById('fchart');
   var jx=X(hist.length-1).toFixed(1),jy=Y(hist[hist.length-1]).toFixed(1);
   var hp=P(hist,0),fp='M'+jx+' '+jy+' '+fc.map(function(v,i){return 'L'+X(hist.length+i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
   var area=hp+'L'+jx+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';
   var grid='';for(var g=0;g<=3;g++){var gy=(pt+g*(H-pt-pb)/3).toFixed(1);grid+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="rgba(148,163,184,.10)"/>';}
   svg.innerHTML='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(139,92,246,.35)"/><stop offset="1" stop-color="rgba(139,92,246,0)"/></linearGradient></defs>'+grid+'<line x1="'+jx+'" y1="'+pt+'" x2="'+jx+'" y2="'+(H-pb)+'" stroke="rgba(139,92,246,.4)" stroke-dasharray="5 6"/><path d="'+area+'" fill="url(#ag)"/><path d="'+hp+'" fill="none" stroke="#8b5cf6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="'+fp+'" fill="none" stroke="#f97316" stroke-width="3.4" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="'+jx+'" cy="'+jy+'" r="5.5" fill="#8b5cf6"/>';
  })();
  window.__READY=true;
</script>
</body>
</html>
