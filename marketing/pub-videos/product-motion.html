*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#dde3ec;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 900px at 82% -8%,rgba(124,58,237,.16),transparent 60%),radial-gradient(1100px 800px at -6% 110%,rgba(249,115,22,.12),transparent 60%),var(--bg)}
#glow{position:absolute;inset:-120px;z-index:0;background:radial-gradient(500px 400px at 20% 30%,rgba(236,72,153,.14),transparent 60%),radial-gradient(560px 440px at 80% 70%,rgba(124,58,237,.14),transparent 60%);will-change:transform}
#grid{position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(15,23,42,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 46%,#000,transparent 78%)}
.sc{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;opacity:0;will-change:opacity}
.win{width:1360px;height:812px;background:var(--card);border-radius:26px;border:1px solid var(--line);box-shadow:0 50px 120px -40px rgba(20,30,60,.4),0 10px 30px -20px rgba(20,30,60,.3);overflow:hidden;display:flex;flex-direction:column;transform-origin:50% 46%;will-change:transform}
.wbar{height:56px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px}
.wbar .d{width:13px;height:13px;border-radius:50%}.wbar .u{margin-left:16px;background:#fff;border:1px solid var(--line);border-radius:9px;height:34px;flex:1;max-width:520px;display:flex;align-items:center;padding:0 16px;color:var(--faint);font-size:19px;gap:8px}.wbar .u svg{width:18px;height:18px}
.wbody{flex:1;min-height:0;padding:34px 40px;display:flex;flex-direction:column;gap:24px;position:relative}
.phead{display:flex;align-items:center;justify-content:space-between}
.phead .h{font-family:'Sora';font-weight:800;font-size:34px}.phead .s{font-size:20px;color:var(--faint);margin-top:4px}
.btnp{background:var(--brand);color:#fff;font-family:'Sora';font-weight:800;font-size:24px;padding:16px 30px;border-radius:14px;display:inline-flex;gap:10px;align-items:center;box-shadow:0 14px 30px -12px rgba(124,58,237,.6);position:relative}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;float:right}.kpi .ic svg{width:24px;height:24px}
.kpi .l{font-size:20px;color:var(--faint);font-weight:600}.kpi .v{font-family:'Sora';font-weight:800;font-size:38px;margin-top:5px;white-space:nowrap}.kpi .c{font-size:18px;font-weight:700;margin-top:6px}.up{color:var(--success)}
.iv{background:var(--sv);color:var(--violet)}.io{background:var(--so);color:var(--orange)}.ip{background:var(--sp);color:var(--pink)}.icy{background:var(--sc);color:var(--cyan)}
.ia{background:linear-gradient(160deg,#fbf9ff,#fff 55%);border:1px solid rgba(124,58,237,.16);border-radius:18px;padding:22px 24px;flex:1;display:flex;flex-direction:column;gap:14px}
.ia .t{font-family:'Sora';font-weight:800;font-size:24px;display:flex;align-items:center;gap:12px}.ia .t .sp{width:44px;height:44px;border-radius:12px;background:var(--brand);display:grid;place-items:center}.ia .t .sp svg{width:24px;height:24px}
.ia svg.ch{flex:1;width:100%}
/* table */
table{width:100%;border-collapse:collapse}thead th{text-align:left;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;padding:15px 16px;border-bottom:1px solid var(--line)}
tbody td{padding:20px 16px;border-bottom:1px solid var(--line2);font-size:24px}.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;font-size:19px;font-weight:700}.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ss);color:var(--success)}.t-w{background:var(--sw);color:var(--warning)}.t-d{background:rgba(229,72,77,.12);color:var(--danger)}.t-i{background:var(--sv);color:var(--violet)}
/* caisse */
.cart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line2);font-size:24px}.ci small{color:var(--faint);font-size:19px}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:14px;border-top:2px solid var(--line)}.grand b{font-family:'Sora';font-size:48px;font-weight:800}
.paid{background:var(--ss);border:1px solid rgba(14,163,113,.35);border-radius:16px;padding:22px;text-align:center;font-family:'Sora';font-weight:800;font-size:32px;color:var(--success);display:flex;align-items:center;justify-content:center;gap:14px}.paid svg{width:40px;height:40px}
/* record */
.plist .row{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;font-size:24px}
.plist .row.sel{background:var(--sv)}
.av{width:52px;height:52px;border-radius:13px;background:var(--brand-soft);color:var(--violet);display:grid;place-items:center;font-weight:800;font-size:21px;border:1px solid rgba(124,58,237,.16)}
.tabs{display:flex;gap:12px;margin-bottom:6px}.tab{padding:12px 20px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:20px;color:var(--muted)}.tab.on{background:var(--sv);color:var(--violet);border-color:rgba(124,58,237,.25)}
.recitem{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:22px}.recitem .ri{width:44px;height:44px;border-radius:11px;background:var(--brand-soft);display:grid;place-items:center}.recitem .ri svg{width:24px;height:24px;stroke:var(--violet)}.recitem .dt{margin-left:auto;color:var(--faint);font-size:19px}

.pay{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ptile{height:150px;border-radius:20px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;gap:20px;padding:0 30px;font-family:'Sora';font-weight:800;font-size:32px;position:relative}
.ptile .b{width:64px;height:64px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:24px}
.wave .b{background:#12a7e0}.om .b{background:#ff7900}.mtn .b{background:#ffcc00;color:#111}.cb .b{background:#1f2a44}
.ok{position:absolute;right:26px;color:var(--success);font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px}.ok svg{width:30px;height:30px}
/* multi */
.estabs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.estab{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.estab .nm{font-family:'Sora';font-weight:700;font-size:26px}.estab .lo{color:var(--faint);font-size:19px;margin-top:2px}.estab .ca{font-family:'Sora';font-weight:800;font-size:30px;margin-top:16px;color:var(--violet)}
.consol{margin-top:auto;background:linear-gradient(120deg,rgba(124,58,237,.10),rgba(249,115,22,.10));border:1px solid rgba(124,58,237,.18);border-radius:18px;padding:26px 30px;display:flex;align-items:center;justify-content:space-between}
.consol .k{font-size:24px;color:var(--muted);font-weight:600}.consol .v{font-family:'Sora';font-weight:800;font-size:52px}
/* brand + captions + cursor + cta */
#brand{position:absolute;top:44px;left:56px;z-index:6;display:flex;align-items:center;gap:14px;opacity:0}
#brand .lg{width:56px;height:56px;border-radius:15px;background:var(--brand);display:grid;place-items:center;box-shadow:0 12px 28px -8px rgba(124,58,237,.5)}#brand .lg svg{width:32px;height:32px}
#brand .nm{font-family:'Sora';font-weight:800;font-size:30px}#brand .nm b{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
#cap{position:absolute;left:0;right:0;bottom:72px;z-index:6;text-align:center;padding:0 200px}
#cap .txt{display:inline-block;font-family:'Sora';font-weight:800;font-size:46px;letter-spacing:-.01em;color:var(--ink);background:rgba(255,255,255,.72);backdrop-filter:blur(6px);padding:18px 34px;border-radius:18px;box-shadow:0 20px 50px -24px rgba(20,30,60,.4);line-height:1.2}
#cursor{position:absolute;z-index:8;width:46px;height:46px;left:0;top:0;pointer-events:none;opacity:0;will-change:transform;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#cursor svg{width:100%;height:100%}
.ripple{position:absolute;z-index:7;border:3px solid var(--violet);border-radius:50%;opacity:0;pointer-events:none}
/* intro + cta big */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .biglogo{width:170px;height:170px;border-radius:44px;background:var(--brand);display:grid;place-items:center;box-shadow:0 40px 90px -20px rgba(124,58,237,.6);margin-bottom:38px}.hero .biglogo svg{width:100px;height:100px}
.hero .bn{font-family:'Sora';font-weight:800;font-size:120px;letter-spacing:-.03em}.hero .bn b{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.cta-main{font-family:'Sora';font-weight:800;font-size:74px;letter-spacing:-.02em;margin-top:26px}
.cta-sub{font-size:38px;color:var(--muted);margin-top:16px}
.cta-btn{margin-top:44px;background:var(--brand);color:#fff;font-family:'Sora';font-weight:800;font-size:44px;padding:26px 60px;border-radius:20px;box-shadow:0 30px 70px -22px rgba(124,58,237,.8);position:relative}
</style></head>

 s2:[{lt:0.4,x:820,y:820},{lt:2.6,x:1300,y:250,click:true},{lt:5,x:1300,y:250}],

};

var cursorEl=document.getElementById('cursor');cursorEl.innerHTML=CURSOR;var rippleEl=document.getElementById('ripple');var capEl=document.getElementById('captxt');var brandEl=document.getElementById('brand');var glowEl=document.getElementById('glow');
// charts
function drawChart(id){var el=document.getElementById(id);if(!el)return;var hist=[95,110,120,105,140,180,90,100,118,128,112,150,190,98,108,126,138,120,162,205,110,120,140,150,132,178,222,120,132,152];var fc=[160,170,180,152,198,246,134,152,178,188,160,208,258,142];var all=hist.concat(fc),W=900,H=220,pl=6,pr=6,pt=10,pb=12;var mn=Math.min.apply(null,all)*0.7,mx=Math.max.apply(null,all)*1.06;var X=function(i){return pl+i*(W-pl-pr)/(all.length-1);},Y=function(v){return H-pb-(v-mn)/(mx-mn)*(H-pt-pb);};var P=function(a,o){return a.map(function(v,i){return (i?'L':'M')+X(o+i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');};var jx=X(hist.length-1).toFixed(1),jy=Y(hist[hist.length-1]).toFixed(1);var hp=P(hist,0),fp='M'+jx+' '+jy+' '+fc.map(function(v,i){return 'L'+X(hist.length+i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');var area=hp+'L'+jx+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';el.innerHTML='<defs><linearGradient id="ag'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(124,58,237,.25)"/><stop offset="1" stop-color="rgba(124,58,237,0)"/></linearGradient></defs><path d="'+area+'" fill="url(#ag'+id+')"/><line x1="'+jx+'" y1="'+pt+'" x2="'+jx+'" y2="'+(H-pb)+'" stroke="rgba(124,58,237,.35)" stroke-dasharray="4 5"/><path d="'+hp+'" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="'+fp+'" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="'+jx+'" cy="'+jy+'" r="5" fill="#7c3aed"/>';}
// ---- easing/helpers ----
function cl(a,b,x){return Math.max(a,Math.min(b,x));}function lerp(a,b,x){return a+(b-a)*x;}
function eio(x){x=cl(0,1,x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}function eo(x){x=cl(0,1,x);return 1-Math.pow(1-x,3);}
function fmtMoney(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' F';}
function ss(x,a,b){return eio(cl(0,1,(x-a)/(b-a)));}
function sceneOpacity(s,t){var f=0.45;var ain=ss(t,s.t0,s.t0+f);var aout=1-ss(t,s.t1-f,s.t1);return cl(0,1,Math.min(ain,aout));}
function applyEntrance(root,lt){root.querySelectorAll('.in,.in2').forEach(function(e){var at=parseFloat(e.getAttribute('data-at')||'0');var d=parseFloat(e.getAttribute('data-d')||'0.6');var p=eo((lt-at)/d);e.style.opacity=cl(0,1,p);e.style.transform='translateY('+((1-p)*26).toFixed(1)+'px)';});
 root.querySelectorAll('.rev').forEach(function(e){var at=parseFloat(e.getAttribute('data-at')||'0');var p=ss(lt,at,at+0.35);e.style.opacity=p;e.style.transform='translateY('+((1-p)*14).toFixed(1)+'px) scale('+lerp(0.96,1,p).toFixed(3)+')';});
 root.querySelectorAll('.count').forEach(function(e){var at=parseFloat(e.getAttribute('data-at')||'0');var d=parseFloat(e.getAttribute('data-d')||'1');var from=parseFloat(e.getAttribute('data-from'));var to=parseFloat(e.getAttribute('data-to'));var p=eio((lt-at)/d);var val=lerp(from,to,p);e.textContent=(e.getAttribute('data-fmt')==='money')?fmtMoney(val):Math.round(val).toString();});}
function setCursor(sid,lt){var path=CUR[sid];if(!path){cursorEl.style.opacity=0;return;}cursorEl.style.opacity=1;var x=path[0].x,y=path[0].y;for(var i=0;i<path.length-1;i++){var a=path[i],b=path[i+1];if(lt>=a.lt&&lt<=b.lt){var p=eio((lt-a.lt)/(b.lt-a.lt));x=lerp(a.x,b.x,p);y=lerp(a.y,b.y,p);break;}else if(lt>b.lt){x=b.x;y=b.y;}}
 var clickT=CLICKS[sid];var pulse=1;if(clickT!=null){var dd=lt-clickT;if(dd>=0&&dd<0.16)pulse=0.8;}
 cursorEl.style.transform='translate('+x+'px,'+y+'px) scale('+pulse+')';
 // ripple
 if(clickT!=null&&lt>=clickT&&lt<clickT+0.5){var rp=(lt-clickT)/0.5;var sz=lerp(20,110,rp);rippleEl.style.opacity=(1-rp)*0.7;rippleEl.style.width=sz+'px';rippleEl.style.height=sz+'px';rippleEl.style.left=(x-sz/2)+'px';rippleEl.style.top=(y-sz/2)+'px';}else if(clickT==null||lt>=clickT+0.5){rippleEl.style.opacity=0;}
}
function renderFrame(t){
 // glow parallax
 glowEl.style.transform='translate('+Math.sin(t*0.3)*30+'px,'+Math.cos(t*0.25)*24+'px)';
 // brand top-left visible from s2..s6
 brandEl.style.opacity=cl(0,1,Math.min(ss(t,5,5.6),1-ss(t,33.4,34)));
 var activeSid=null,bestOp=0;
 SC.forEach(function(s){var op=sceneOpacity(s,t);s.el.style.opacity=op;s.el.style.display=op>0.002?'flex':'none';
  if(op>0.002){var lt=t-s.t0;var camp=eo(lt/s.dur);var scale=lerp(s.cam[0],s.cam[1],camp);if(s.win)s.win.style.transform='scale('+scale.toFixed(4)+')';applyEntrance(s.el,lt);if(op>bestOp){bestOp=op;activeSid=s.id;}}});
 // cursor for active scene
 setCursor(activeSid,activeSid?(t-SC.filter(function(s){return s.id===activeSid})[0].t0):0);
 // caption (per active scene index)
 var idx=SC.findIndex(function(s){return s.id===activeSid});
 if(idx>=0&&CAP[idx]){var s=SC[idx];var lt=t-s.t0;var cin=ss(lt,0.3,0.8);var cout=1-ss(lt,s.dur-0.6,s.dur);var cop=cl(0,1,Math.min(cin,cout));capEl.textContent=CAP[idx];capEl.parentElement.style.opacity=cop;capEl.style.transform='translateY('+((1-cin)*20).toFixed(1)+'px)';}
 else{capEl.parentElement.style.opacity=0;}
 // cta button pulse
 var cb=document.getElementById('ctabtn');if(cb){var lt7=t-34;var pl=lt7>1.5?(1+Math.sin((lt7-1.5)*4)*0.03):1;cb.style.transform='scale('+pl.toFixed(3)+')';}
}
